<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>저스트 원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#fffaf0; --ink:#3a2a1a; --shadow:0 5px 0 rgba(0,0,0,.22),0 12px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Jua',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.18),transparent 55%),
    radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.18),transparent 60%),
    repeating-linear-gradient(90deg,#c88a4c 0 74px,#b87a3e 74px 76px,#cf9456 76px 150px,#b3743a 150px 152px,#c4864a 152px 230px,#b77a3f 230px 232px);
  background-attachment:fixed;
}
#app{max-width:1000px;margin:0 auto;padding:12px 12px 70px}
button{font-family:inherit}
.btn{font-size:18px;border:none;border-radius:14px;padding:12px 20px;background:#ffcd3c;color:#553800;box-shadow:0 4px 0 #c99812;cursor:pointer;transition:transform .08s,box-shadow .08s;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c99812}
.btn.blue{background:#3d8bfd;color:#fff;box-shadow:0 4px 0 #2360c4}
.btn.green{background:#35b86b;color:#fff;box-shadow:0 4px 0 #23864b}
.btn.red{background:#ef5350;color:#fff;box-shadow:0 4px 0 #b53330}
.btn.gray{background:#e7ddcb;color:#5a4630;box-shadow:0 4px 0 #b9a888}
.btn.small{font-size:15px;padding:8px 13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 16px;margin:12px auto;max-width:640px;text-align:center}
.panel h2{margin:4px 0 8px;font-weight:400}
.panel p{margin:6px 0;line-height:1.5}
.note{font-size:14px;color:#8a6a45}
input.txt{font-family:inherit;font-size:19px;padding:10px 14px;border-radius:12px;border:3px solid #e2d3b6;background:#fff;outline:none;width:100%;max-width:280px;text-align:center}
input.txt:focus{border-color:#ffb74d}
.foot{margin-top:22px;text-align:center;color:#fff8;font-size:14px;text-shadow:0 1px 2px #0005}

/* ===== 메뉴 ===== */
.menu{text-align:center;padding-top:26px}
.logo{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.logo .easel{animation:bob 3s ease-in-out infinite}
.logo .easel:nth-child(2){animation-delay:-.7s}.logo .easel:nth-child(3){animation-delay:-1.4s}.logo .easel:nth-child(4){animation-delay:-2.1s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.logo .board{width:88px!important;height:88px!important}
.logo .hand{font-size:74px!important}
.sub{color:#fff;font-size:20px;text-shadow:0 2px 3px #0006;margin:14px 0 20px}
.menu-btns{display:flex;flex-direction:column;align-items:center;gap:6px}
.menu-btns .btn{width:260px;font-size:21px;padding:15px}

/* ===== 이젤 ===== */
.easel{position:relative;display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom}
.easel .board{
  position:relative;container-type:inline-size;overflow:hidden;
  background:linear-gradient(165deg,#ffffff 0%,#f5f8fb 55%,#e8edf2 100%);
  border:7px solid var(--pc,#e53935);border-radius:12px;
  box-shadow:inset 0 0 0 2px #fff,inset 0 -6px 10px rgba(0,0,0,.05),0 4px 0 rgba(0,0,0,.25);
  transition:box-shadow .2s,transform .2s;
}
.easel .board::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 38%,transparent 46%)}
.easel .ledge{width:108%;height:11px;margin-top:-3px;background:var(--pc,#e53935);filter:brightness(.82);border-radius:4px;position:relative;z-index:1;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.easel .legs{position:relative;width:70%;height:22px}
.easel .legs::before,.easel .legs::after{content:'';position:absolute;top:-4px;width:9px;height:28px;background:var(--pc,#e53935);filter:brightness(.7);border-radius:4px}
.easel .legs::before{left:14%;transform:rotate(16deg)}
.easel .legs::after{right:14%;transform:rotate(-16deg)}
.easel .nm{font-size:15px;color:#fff;text-shadow:0 1px 3px #000a;margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.easel.mini .board{width:140px;height:92px}
.easel.big .board{width:min(88vw,430px);height:168px;cursor:text}
.easel.big .board.focus{box-shadow:inset 0 0 0 2px #fff,0 0 0 5px #ffe58a,0 4px 0 rgba(0,0,0,.25);transform:translateY(-2px)}
.easel.big .ledge .cap{position:absolute;right:10%;top:-9px;width:44px;height:10px;border-radius:5px;background:var(--pc);filter:brightness(1.1);box-shadow:inset -12px 0 0 #333}

/* ===== 손글씨 ===== */
.hand{font-family:'Nanum Pen Script',cursive;display:flex;align-items:center;justify-content:center;height:100%;padding:0 12px;white-space:nowrap;line-height:1;color:var(--pc,#222);text-shadow:0 0 1px currentColor,0 0 .5px currentColor}
.hand .ch{display:inline-block;transform:rotate(var(--r,0deg)) translateY(var(--y,0px))}
.hand .ch.n{animation:draw .42s cubic-bezier(.3,.7,.4,1) both}
.hand .ch.m{animation:redraw .22s ease-out}
@keyframes draw{
  0%{clip-path:inset(-30% 100% -30% -10%);opacity:.2;filter:blur(1.4px);transform:rotate(var(--r,0deg)) translateY(var(--y,0px)) scale(1.3)}
  55%{opacity:1;filter:blur(0)}
  100%{clip-path:inset(-30% -20% -30% -10%);transform:rotate(var(--r,0deg)) translateY(var(--y,0px)) scale(1)}
}
@keyframes redraw{0%{transform:rotate(var(--r,0deg)) translateY(var(--y,0px)) scale(1.15);filter:blur(.8px)}100%{transform:rotate(var(--r,0deg)) translateY(var(--y,0px)) scale(1)}}
.hand .ph{font-size:30px;color:#a9b3bd;text-shadow:none}
.pen{display:inline-block;width:.42em;height:1.25em;margin-left:.04em;transform-origin:10% 100%;transform:translateY(-.38em) rotate(28deg);pointer-events:none}
.pen svg{width:100%;height:100%;display:block;filter:drop-shadow(2px 3px 1px rgba(0,0,0,.25))}
.pen.go{animation:scrib .24s ease-in-out}
.pen.idle{animation:hover 1.2s ease-in-out infinite}
@keyframes scrib{0%,100%{transform:translateY(-.38em) rotate(28deg)}30%{transform:translate(-.08em,-.46em) rotate(18deg)}70%{transform:translate(.06em,-.3em) rotate(36deg)}}
@keyframes hover{50%{transform:translateY(-.5em) rotate(24deg)}}
input.ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;margin:0;cursor:text;z-index:3}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.wtools{display:flex;justify-content:center;gap:6px;margin:2px 0 8px}
.writers{display:flex;flex-direction:column;align-items:center;gap:4px}
.wlabel{font-size:15px;color:#7a5a38;margin:6px 0 -2px}

/* 지우개 */
.eraser{position:absolute;z-index:4;top:8%;left:-40%;width:34%;height:84%;border-radius:9px;transform:rotate(-8deg);
  background:linear-gradient(180deg,#34349a 0 42%,#23236e 42% 48%,#f3e7c7 48% 100%);box-shadow:0 4px 6px rgba(0,0,0,.3);
  animation:wipe .7s ease-in-out both}
@keyframes wipe{0%{left:-40%;top:8%}25%{top:0%}50%{top:16%}75%{top:4%}100%{left:112%;top:10%}}
.board.x .hand{opacity:.16;filter:blur(1.6px);transition:opacity .4s .3s,filter .4s .3s}
.xbadge{position:absolute;z-index:2;right:4px;top:4px;background:#ef5350;color:#fff;font-size:12px;padding:2px 7px;border-radius:9px;font-family:'Jua'}
.wbadge{position:absolute;z-index:2;left:4px;top:4px;background:#ffb300;color:#442;font-size:11px;padding:2px 6px;border-radius:9px}
.easel.click{cursor:pointer}
.easel.click:hover .board{transform:translateY(-3px)}
.smudge{position:absolute;inset:18% 12%;border-radius:40%;background:radial-gradient(ellipse,rgba(120,130,150,.18),transparent 70%)}
.blank{display:flex;align-items:center;justify-content:center;height:100%;color:#b6bec7;font-size:14px}

/* 상태 이젤 */
.status .board{display:flex;align-items:center;justify-content:center}
.status .idle{font-size:30px;color:#c2cad2;letter-spacing:4px}
.status .done{font-size:17px;color:#fff;background:var(--pc);border-radius:10px;padding:5px 10px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.status.writing .board{animation:jiggle .35s ease-in-out infinite}
@keyframes jiggle{50%{transform:rotate(.6deg) translateY(-1px)}}
.scrib path{stroke:var(--pc);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:dash 1.3s linear infinite}
@keyframes dash{70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.status .spen{position:absolute;width:18px;height:48px;right:18px;top:10px;animation:penmove 1.3s ease-in-out infinite}
@keyframes penmove{0%{right:92px;top:18px}20%{top:6px}40%{top:22px}60%{top:8px}70%{right:22px;top:16px}100%{right:92px;top:18px}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* ===== 카드 ===== */
.easel.hold .board{padding:8px;background:linear-gradient(#d9c4a0,#c9b187);overflow:visible;container-type:normal}
.easel.hold .board::after{display:none}
.card{width:176px;background:#fff;border-radius:12px;padding:8px 7px;box-shadow:0 3px 0 rgba(0,0,0,.2);border:2px solid #efe6d6}
.card .row{display:flex;align-items:center;gap:8px;padding:3px 6px;margin:3px 0;border-radius:9px;font-size:21px;transition:all .3s;text-align:left}
.card .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.card .w{flex:1;border-bottom:3px solid var(--c);padding-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row.sel{background:color-mix(in srgb,var(--c) 22%,#fff);outline:3px solid var(--c);transform:scale(1.07);font-size:23px}
.card .row.dim{opacity:.3}
.card.back{height:212px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:repeating-linear-gradient(45deg,#fff 0 12px,#f4efe4 12px 24px)}
.card.back .q{font-size:64px;color:#3d8bfd;text-shadow:3px 3px 0 #ffcd3c;line-height:1}
.card.back .dots{display:flex;gap:6px}
.card.back .dots span{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;display:grid;place-items:center}
.card.reveal{animation:flipin .6s ease-out}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.holder{display:flex;flex-direction:column;align-items:center}
.stamp{position:absolute;z-index:5;left:50%;top:44%;font-size:36px;white-space:nowrap;padding:4px 16px;border:5px solid currentColor;border-radius:14px;background:rgba(255,255,255,.9);
  transform:translate(-50%,-50%) rotate(-10deg);animation:stampin .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp.ok{color:#2e9e5b}.stamp.bad{color:#e53935}.stamp.pass{color:#8d6e63}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}

/* ===== 게임 화면 ===== */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:rgba(60,35,15,.45);border-radius:18px;padding:10px 12px;color:#fff}
.piles{display:flex;gap:12px;align-items:flex-end}
.pile{display:flex;flex-direction:column;align-items:center;font-size:13px;gap:3px}
.pile .stk{position:relative;width:42px;height:56px;border-radius:7px;display:grid;place-items:center;font-size:20px;color:#fff;
  box-shadow:2px -2px 0 -1px #fff,3px -3px 0 -1px rgba(0,0,0,.25),5px -5px 0 -1px #fff,6px -6px 0 -1px rgba(0,0,0,.25)}
.pile .deck{background:repeating-linear-gradient(45deg,#3d8bfd 0 7px,#5a9dfd 7px 14px)}
.pile .ok{background:#35b86b}
.pile .box{background:#8d6e63}
.pile .stk.empty{box-shadow:none;background:transparent;border:2px dashed #fff8}
.rnd{font-size:20px;text-align:center}
.rnd small{display:block;font-size:13px;opacity:.85}
.tools{display:flex;gap:4px}
.ibtn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;width:38px;height:38px;border-radius:12px;cursor:pointer}
.seats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.seat{background:#fffaf0;border-radius:20px;padding:4px 11px 4px 6px;font-size:15px;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.seat i{width:14px;height:14px;border-radius:50%;background:var(--pc);display:inline-block}
.seat.act{background:#ffe082;outline:3px solid #ffb300}
.seat.off{opacity:.45}
.table{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px 16px;padding:18px 8px 10px;margin-top:8px;border-radius:22px;background:rgba(0,0,0,.08)}
.easels{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;flex:1 1 300px}
.caption{text-align:center;color:#fff;font-size:19px;text-shadow:0 2px 3px #0008;margin:10px}
.sleep{text-align:center;color:#fff;font-size:80px;padding:30px 0 10px;text-shadow:0 3px 6px #0006}
.sleep p{font-size:24px;margin:6px}.sleep small{font-size:16px}
.sleep span{display:inline-block;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-8px) rotate(-5deg)}}
.numbtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.numbtn{width:58px;height:58px;border-radius:50%;border:none;font-size:28px;color:#fff;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 -4px 0 rgba(0,0,0,.15);cursor:pointer;transition:transform .1s}
.numbtn:hover{transform:translateY(-3px)}
.numbtn:disabled{opacity:.25;cursor:default;transform:none}
.rules-mini{text-align:left;font-size:14.5px;background:#fff3dc;border-radius:12px;padding:8px 12px 8px 26px;margin:8px 0;color:#6b4b2a}
.rules-mini li{margin:3px 0}
.big-emo{font-size:70px;margin:6px}
.guessline{font-family:'Nanum Pen Script';font-size:40px}
.answer{display:inline-block;font-size:30px;background:#fff3c4;border-radius:10px;padding:2px 14px;margin:4px}
.waiting{font-size:19px;color:#7a5a38}
.dots3::after{content:'';animation:dd 1.5s steps(4) infinite}
@keyframes dd{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* 결과 */
.score{font-size:92px;line-height:1;color:#35b86b;text-shadow:0 5px 0 #23864b33}
.score small{font-size:34px;color:#8a6a45}
.rate{font-size:24px}
.rlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.rchip{background:#fff;border-radius:10px;padding:5px 10px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12);border-left:6px solid #ccc}
.rchip.correct{border-color:#35b86b}.rchip.wrong,.rchip.lost{border-color:#ef5350}.rchip.burned{border-color:#555}.rchip.pass,.rchip.allcancel{border-color:#8d6e63}
.stable{font-size:14px;color:#8a6a45;margin:8px auto;border-collapse:collapse}
.stable td{padding:2px 8px}
.stable tr.me td{background:#ffe082;border-radius:6px}

/* 로비 등 */
.code{font-size:48px;letter-spacing:8px;color:#3d8bfd;background:#eef4ff;border-radius:14px;padding:4px 18px;display:inline-block;margin:6px}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{border:none;font-size:18px;padding:8px 14px;border-radius:12px;background:#efe4cf;color:#6b4b2a;cursor:pointer}
.chip.on{background:#3d8bfd;color:#fff}
.names{display:flex;flex-direction:column;align-items:center;gap:7px;margin:10px 0}
.names label{display:flex;align-items:center;gap:8px}
.names i{width:18px;height:18px;border-radius:50%;display:inline-block}
.warnbox{background:#fff0f0;border:2px dashed #ef9a9a;border-radius:12px;padding:10px;font-size:14.5px;color:#a33;text-align:left;line-height:1.55}
.warnbox code{background:#fff;padding:1px 5px;border-radius:5px}
.curtain{padding:34px 20px}
.curtain .big-emo{font-size:90px;animation:bob 2s ease-in-out infinite}

/* 모달/토스트/컨페티 */
.modal{position:fixed;inset:0;background:rgba(30,15,5,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .panel{max-height:88vh;overflow:auto;text-align:left;max-width:600px}
.modal h3{margin:14px 0 4px;color:#3d8bfd;font-weight:400}
.modal li{margin:4px 0;line-height:1.5}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#3a2a1a;color:#fff;padding:12px 20px;border-radius:14px;font-size:17px;z-index:60;transition:transform .3s;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ===== 온라인: 접속 점 · 채팅 · 말풍선 · 안내 ===== */
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:#b9b2a6;transition:background .3s}
.pdot.good{background:#3fae66;box-shadow:0 0 6px rgba(63,174,102,.6)}
.pdot.mid{background:#d7b24a}.pdot.bad{background:#d9833f}.pdot.stale{background:#b8483f}.pdot.off{background:#b9b2a6}
.easel .nm .pdot{margin-right:4px;vertical-align:1px}
.chatbox{max-height:210px;min-height:70px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 0 8px;text-align:left}
.chat-sheet{width:100%;max-width:520px}
.chat-sheet .chatbox{max-height:46vh;min-height:140px}
.cmsg{font-size:15px;line-height:1.45;max-width:86%;align-self:flex-start;background:#f4efe6;padding:6px 10px;border-radius:12px;word-break:break-all}
.cmsg.mine{align-self:flex-end;background:#fff1c9}
.cmsg .cn{font-size:12px;color:#8a6a45;display:flex;align-items:center;gap:4px;margin-bottom:1px}
.cmsg .cn i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cmsg.sys{align-self:center;background:transparent;color:#8a6a45;font-size:13px}
.chat-empty{font-size:14px;color:#8a6a45;text-align:center;padding:14px 0}
.chatform{display:flex;gap:8px;align-items:center;margin-top:6px}
.chatform input{flex:1;min-width:0;font-family:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:3px solid #e2d3b6;outline:none;background:#fff}
.chatform input:focus{border-color:#ffb74d}
.chatform .btn{margin:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.qchip{font-family:inherit;font-size:14px;color:#5a4630;background:#fff;border:2px solid #e2d3b6;border-radius:14px;padding:5px 10px;cursor:pointer}
.qchip:active{background:#fff6d6}
.chat-rule{font-size:12.5px;color:#8a6a45;margin:2px 0 6px;line-height:1.5}
.chat-tip{display:none;font-size:13px;color:#9c3028;background:#fde4df;border-radius:8px;padding:6px 10px;margin:4px 0}
.chat-tip.on{display:block}
.ibtn.chatbtn{position:relative}
.cbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#ef5350;color:#fff;font-size:11px;line-height:18px;padding:0 4px;font-family:system-ui}
.bubble{position:fixed;transform:translate(-50%,-100%);z-index:45;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;border:2.5px solid #3a2a1a;color:#3a2a1a;font-size:14px;line-height:1.35;
  padding:5px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none;transition:opacity .5s;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}

  const line = (ok, t) => `<div class="diag"><span class="dmark ${ok === null ? 'wait' : ok ? 'ok' : 'no'}"></span><span>${t}</span></div>`;
  const close = `<div class="mbtns"><button class="btn" data-a="closeModal">닫기</button></div>`;
  let html = line(typeof firebase !== 'undefined', 'Firebase 라이브러리 불러오기');
  if (typeof firebase === 'undefined') return openMsg(`<h2>서버 연결 확인</h2>${html}<p class="note">gstatic.com 접속이 막혀 있거나 인터넷이 끊겼어요.</p>${close}`);
  const started = initFirebase(); html += line(started, '설정으로 초기화');
  if (!started) return openMsg(`<h2>서버 연결 확인</h2>${html}<p class="note">파일의 firebaseConfig를 확인해 주세요.</p>${close}`);
  openMsg(`<h2>서버 연결 확인</h2>${html}${line(null, '데이터베이스 읽기·쓰기 확인 중')}`);
  let rw = false, msg = '';
  try { const t = db.ref(ROOT + '/__diag__/' + MYID); await t.set({ at: TS() }); await t.get(); await t.remove(); rw = true; }
  catch (e) { msg = String((e && e.message) || e); }
  html += line(rw, '데이터베이스 읽기·쓰기');
  openMsg(`<h2>서버 연결 확인</h2>${html}
    <p class="note">${rw ? '모두 정상이에요.' : '여기서 막혔어요. 대부분 데이터베이스 규칙 문제예요.'}</p>
    ${rw ? '' : RULES_CODE + `<p class="note" style="word-break:break-all">${esc(msg)}</p>`}${close}`);
}

/* ---------- 돌아가기 ---------- */
function savedRoom() {
  try {
    const v = JSON.parse(lsGet(ROOM_KEY) || 'null');
    if (!v || !v.code || !v.id) return null;
    if (Date.now() - (v.t || 0) > 6 * 3600 * 1000) { lsDel(ROOM_KEY); return null; }   // 6시간 지나면 잊음
    return v;
  } catch (e) { return null; }
}
async function resumeRoom() {
  const sv = savedRoom(); if (!sv || !checkFB()) return;
  try {
    const sn = await db.ref(roomPath(sv.code) + '/state').get();
    if (!sn.exists()) { toast('그 방은 이미 닫혔어요'); lsDel(ROOM_KEY); render(); return; }
    const st = sn.val();
    if (!st.players || !st.players[sv.id]) { toast('그 방에 내 자리가 없어요'); lsDel(ROOM_KEY); render(); return; }
    MYID = sv.id; ssSet('j1_pid', MYID);          // 원래 번호로 같은 자리에
    enterRoom(sv.code);
  } catch (e) { toast(fbErrMsg(e)); showFbError(e); }
}

/* ---------- 방 만들기·참가 ---------- */
function mutate(fn) {
  if (!stateRef) return Promise.resolve();
  return stateRef.transaction(cur => {
    if (cur === null) return cur;
    cur.players = cur.players || {};
    if (fn(cur) === false) return;         // 중단
    return cur;
  }).catch(e => { toast(fbErrMsg(e)); });
}
async function oCreate() {
  const name = getName(); if (!name || !checkFB()) return;
  try {
    let code;
    for (let t = 0; t < 8; t++) { code = genCode(); const ex = await db.ref(roomPath(code) + '/state').get(); if (!ex.exists()) break; }
    await db.ref(roomPath(code)).set({ createdAt: TS(), state: { host: MYID, status: 'lobby', players: { [MYID]: { name, j: Date.now() } } } });
    enterRoom(code);
  } catch (e) { toast(fbErrMsg(e)); showFbError(e); }
}
async function oJoin() {
  const name = getName(); if (!name) return;
  const code = ($('#ocode')?.value || '').trim().toUpperCase();
  if (code.length !== 4) return toast('방 코드 4자리를 입력해 주세요');
  if (!checkFB()) return;
  try {
    const sn = await db.ref(roomPath(code) + '/state').get();
    if (!sn.exists()) return toast('그런 방이 없어요');
    const s0 = sn.val();
    /* 탭을 복제하면 같은 번호를 갖게 돼요. 그 번호로 이미 접속 중인 사람이 있으면 새 번호를 받아요. */
    if (s0.players && s0.players[MYID]) {
      let active = false;
      try { const p = (await db.ref(`${PRES_PATH}/${code}/${MYID}`).get()).val();
        const age = p && p.lastSeen ? Date.now() - p.lastSeen : Infinity; active = !!p && p.connected !== false && age >= 0 && age < 15000; } catch (e) {}
      if (active) { MYID = newUid(); ssSet('j1_pid', MYID); }
    }
    let err = '';
    const res = await db.ref(roomPath(code) + '/state').transaction(cur => {
      if (cur === null) return cur;
      cur.players = cur.players || {};
      const ex = cur.players[MYID];
      if (ex) { ex.name = name; return cur; }                                   // 재접속
      if (cur.status !== 'lobby') { err = '이미 게임이 시작된 방이에요'; return; }
      if (Object.keys(cur.players).length >= 7) { err = '방이 가득 찼어요 (최대 7명)'; return; }
      cur.players[MYID] = { name, j: Date.now() };
      return cur;
    });
    if (!res.snapshot.exists()) return toast('그런 방이 없어요');
    if (!res.committed) return toast(err || '참가하지 못했어요');
    enterRoom(code);
  } catch (e) { toast(fbErrMsg(e)); showFbError(e); }
}

/* ---------- 방 입장·구독 ---------- */
function enterRoom(code) {
  ONL = { code, room: null, typing: {} }; leaving = false;
  const base = db.ref(roomPath(code));
  stateRef = base.child('state'); typingRef = base.child('typing');
  try { history.replaceState(null, '', '?room=' + code); } catch (e) {}
  lsSet(ROOM_KEY, JSON.stringify({ code, id: MYID, t: Date.now() }));
  watchConnection(); startPresence(code); startChat(code);
  typingRef.child(MYID).onDisconnect().remove();
  stateRef.on('value', snap => {
    if (leaving) return;
    const st = snap.val();
    if (!st) { toast('방이 사라졌어요'); lsDel(ROOM_KEY); leaveRoom(); return; }
    if (!st.players || !st.players[MYID]) { toast('방에서 나왔어요'); lsDel(ROOM_KEY); leaveRoom(); return; }
    ONL.room = { ...st, typing: ONL.typing };
    lsSet(ROOM_KEY, JSON.stringify({ code, id: MYID, t: Date.now() }));
    if (st.status === 'playing' && st.game) { G = fix(st.game); if (MODE !== 'ogame') { MODE = 'ogame'; $('#app')._shell = false; } }
    else { G = null; MODE = 'lobby'; }
    maybeMoveHost();
    render();
  }, e => { toast(fbErrMsg(e)); showFbError(e); });
  typingRef.on('value', snap => { ONL.typing = snap.val() || {}; if (ONL.room) ONL.room.typing = ONL.typing; if (MODE === 'ogame') render(); });
}
function leaveRoom() {
  try { if (stateRef) stateRef.off(); if (typingRef) typingRef.off(); if (chatRef) chatRef.off(); } catch (e) {}
  stopPresence();
  if (ONL.code && db) {
    try { const pr = db.ref(`${PRES_PATH}/${ONL.code}/${MYID}`); pr.onDisconnect().cancel(); pr.remove();
      if (typingRef) { typingRef.child(MYID).onDisconnect().cancel(); typingRef.child(MYID).remove(); } } catch (e) {}
  }
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  stateRef = typingRef = chatRef = null; ONL = { code: '', room: null, typing: {} }; CHAT = []; CHAT_UNREAD = 0;
  closeChat(); $('#connbar').classList.remove('on'); leaving = false;
  G = null; MODE = 'menu'; render();
}
/* 방에서 나가기
   대기실: 자리를 비우고, 마지막 한 명이면 방을 지워요.
   게임 중: 자리는 남겨 둬요. 같은 방 코드나 '돌아가기'로 이어서 할 수 있어요. */
async function doLeave() {
  const r = ONL.room;
  if (!ONL.code || !r) { lsDel(ROOM_KEY); leaveRoom(); return; }
  leaving = true;
  const others = Object.keys(r.players || {}).filter(p => p !== MYID);
  try {
    if (!others.length) await db.ref(roomPath()).remove();
    else if (r.status === 'lobby') {
      await mutate(s => { delete s.players[MYID]; if (s.host === MYID) { const nx = Object.entries(s.players).sort((a, b) => (a[1].j || 0) - (b[1].j || 0))[0]; if (nx) s.host = nx[0]; } });
    } else if (r.host === MYID) {
      const alive = others.find(p => !isGone(p)) || others[0];
      await mutate(s => { if (s.host === MYID) s.host = alive; });
    }
  } catch (e) { console.error(e); }
  if (!others.length || r.status === 'lobby') lsDel(ROOM_KEY);   // 게임 중에 나가면 '돌아가기'로 이어서 할 수 있게 남겨 둬요
  leaveRoom();
}
function confirmLeave() {
  const playing = ONL.room && ONL.room.status === 'playing';
  openMsg(`<h2>나갈까요?</h2>
    <p>${playing ? '게임이 아직 진행 중이에요. 자리는 남아 있어서 같은 방 코드나 “돌아가기”로 다시 들어오면 이어서 할 수 있어요. 그동안 방장이 내 차례를 넘길 수 있어요.' : '대기실에서 나가요.'}</p>
    <div class="mbtns"><button class="btn gray" data-a="closeModal">취소</button><button class="btn red" data-a="doLeave">나가기</button></div>`);
}
function oStart() {
  const ps = lobbyPlayers().filter(([id]) => !isGone(id));
  if (ps.length < 3) return toast('3명 이상 필요해요'); if (ps.length > 7) return toast('최대 7명까지 할 수 있어요');
  const order = ps.map(x => x[0]), names = {}, colors = {};
  ps.forEach(([id, p], i) => { names[id] = p.name; colors[id] = i; });
  stateRef.update({ status: 'playing', game: newGame(order, names, colors) }).catch(e => toast(fbErrMsg(e)));
  typingRef.remove().catch(() => {});
}

/* ---------- 접속 감시 ---------- */
function watchConnection() {
  if (connWatched || !db) return; connWatched = true;
  db.ref('.info/serverTimeOffset').on('value', s => { srvOffset = s.val() || 0; });
  db.ref('.info/connected').on('value', s => {
    selfOffline = s.val() !== true;
    if (!selfOffline && ONL.code) {
      const pr = db.ref(`${PRES_PATH}/${ONL.code}/${MYID}`);
      pr.onDisconnect().update({ connected: false });
      pr.update({ connected: true, lastSeen: TS() });
      if (typingRef) typingRef.child(MYID).onDisconnect().remove();
    }
    $('#connbar').classList.toggle('on', !!ONL.code && selfOffline);
  });
}
function startPresence(code) {
  const r = db.ref(`${PRES_PATH}/${code}/${MYID}`);
  r.set({ connected: true, lastSeen: TS(), pingMs: null });
  r.onDisconnect().update({ connected: false });
  presReady = false;
  db.ref(`${PRES_PATH}/${code}`).on('value', s => { PRES = s.val() || {}; presReady = true; paintPresence(); });
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if (!ONL.code) return;
    const t0 = Date.now();
    r.update({ lastSeen: TS() }).then(() => r.update({ pingMs: Date.now() - t0, connected: true })).catch(() => {});
  }, PING_MS);
  clearInterval(presTimer);
  presTimer = setInterval(() => {
    paintPresence(); maybeMoveHost();
    const ids = Object.keys((ONL.room && ONL.room.players) || {});
    const sig = ids.map(p => (isGone(p) ? 2 : isOff(p) ? 1 : 0)).join('');   // 끊긴 사람이 생기거나 돌아오면 다시 그림
    if (sig !== lastGoneSig) { lastGoneSig = sig; if (MODE === 'ogame' || MODE === 'lobby') render(); }
  }, 1000);
}
function stopPresence() {
  clearInterval(pingTimer); pingTimer = null; clearInterval(presTimer); presTimer = null;
  if (ONL.code && db) try { db.ref(`${PRES_PATH}/${ONL.code}`).off(); } catch (e) {}
  PRES = {}; presReady = false; lastGoneSig = '';
}
/* 점 색으로 연결 상태 */
function presCls(uid) {
  const m = PRES[uid];
  if (!m) return 'off';
  if (m.connected === false) return 'stale';
  if (m.lastSeen && serverNow() - m.lastSeen > STALE_MS) return 'stale';
  return m.pingMs == null ? 'mid' : (m.pingMs < 150 ? 'good' : m.pingMs < 400 ? 'mid' : 'bad');
}
const pdotHTML = uid => (MODE === 'ogame' || MODE === 'lobby') ? `<span class="pdot" data-pid="${uid}"></span>` : '';
function paintPresence() {
  document.querySelectorAll('.pdot[data-pid]').forEach(el => { el.className = 'pdot ' + presCls(el.dataset.pid); });
}
/* 잠깐(7초) 끊김 — 좌석을 흐리게 */
function isOff(uid) {
  if (!ONL.code || uid === MYID || !presReady) return false;
  return ['stale', 'off'].includes(presCls(uid));
}
/* 오래(20초) 연결이 끊긴 사람 — 나간 사람 포함 */
function isGone(uid) {
  if (!ONL.code || uid === MYID || !presReady) return false;
  const m = PRES[uid];
  if (!m) return true;
  return serverNow() - (m.lastSeen || 0) > TAKEOVER_MS;
}
/* 방장이 오래 사라지면 남은 사람 중 가장 먼저 들어온 사람이 이어받아요 */
function maybeMoveHost() {
  const r = ONL.room;
  if (!r || !ONL.code || r.host === MYID || !presReady || !isGone(r.host)) return;
  const alive = lobbyPlayers().map(x => x[0]).filter(u => { const m = PRES[u]; return u === MYID || (m && m.connected !== false && serverNow() - (m.lastSeen || 0) < STALE_MS); });
  if (alive.length && alive[0] === MYID) {
    const old = r.host;
    mutate(s => { if (s.host !== old) return false; s.host = MYID; });
  }
}

/* =========================================================
   채팅
   ========================================================= */
let CHAT = [], CHAT_OPEN = false, CHAT_UNREAD = 0, CHAT_LAST = 0, CHAT_SENT_AT = 0, CHAT_LAST_TEXT = '';
/* 힌트를 쓰는 동안(상의 금지)에도 보낼 수 있는 말만 모았어요 */
const QUICK = ['다 썼어요!', '잠깐만요 ⏳', '좋은 힌트다!', '아깝다!', '잘했어 👏', 'ㅋㅋㅋ', '한 판 더!'];
function startChat(code) {
  CHAT = []; CHAT_UNREAD = 0; CHAT_LAST = 0;
  chatRef = db.ref(roomPath(code) + '/chat');
  chatRef.limitToLast(40).on('value', s => {
    const v = s.val() || {};
    const list = Object.entries(v).map(([k, m]) => ({ k, ...m })).sort((a, b) => (a.t || 0) - (b.t || 0) || (a.k < b.k ? -1 : 1));
    const fresh = list.filter(m => (m.t || 0) > CHAT_LAST && CHAT.every(c => c.k !== m.k));
    const first = CHAT.length === 0 && CHAT_LAST === 0;
    CHAT = list; if (list.length) CHAT_LAST = Math.max(CHAT_LAST, ...list.map(m => m.t || 0));
    if (!first) fresh.forEach(m => {
      if (m.uid !== MYID && !CHAT_OPEN && MODE === 'ogame') CHAT_UNREAD++;
      if (m.uid !== MYID) SFX.pop();
      showBubble(m);
    });
    renderChat();
  });
}
/* 교실에서 자주 나오는 표현을 1차로 걸러 내는 기본 목록 */
const BAD_WORDS = [
  "시발","씨발","씨팔","시팔","ㅅㅂ","개새끼","개색기","새꺄","병신","ㅂㅅ","좆","좇",
  "존나","존내","걸레","창녀","미친놈","미친년","지랄","닥쳐","꺼져","뒤져","죽어라",
  "한남충","한녀충","틀딱","급식충","맘충","fuck","fucking","shit","bitch","asshole",
  "bastard","nigger","retard"
];
const CHAT_MAX = 100, CHAT_COOL = 1200, CHAT_DUP = 15000;
/* 같은 글자를 8번 넘게 반복하면 8개로 줄임 */
function squash(t) { return t.replace(/(.)\1{7,}/g, (m, c) => c.repeat(8)); }
/* 띄어쓰기·기호로 피해 가는 것도 잡도록, 기호를 뺀 축약본에서 찾아 원래 자리를 *로 가림 */
function maskBad(text) {
  const skip = /[\s.,!?~^*\-_'"]/;
  let plain = ''; const map = [];
  for (let i = 0; i < text.length; i++) { if (!skip.test(text[i])) { plain += text[i]; map.push(i); } }
  const low = plain.toLowerCase(), chars = text.split(''); let hit = false;
  for (const w0 of BAD_WORDS) {
    const w = w0.toLowerCase(); if (!w) continue;
    let from = 0, pos;
    while ((pos = low.indexOf(w, from)) !== -1) { hit = true; for (let k = 0; k < w.length; k++) chars[map[pos + k]] = '*'; from = pos + w.length; }
  }
  return { text: chars.join(''), hit };
}
/* 자음만 있는 메시지는 막되 ㅋㅋㅋ · ㅎㅎㅎ 웃음은 허용 */
function onlyJamo(t) {
  const x = t.replace(/\s+/g, '');
  if (!x || /^[ㅋㅎ]+$/.test(x)) return false;
  return /^[ㄱ-ㅎ]+$/.test(x);
}
/* 저스트 원 전용: 라운드 중에는 카드 단어·힌트가 들어간 메시지를 막아요 (추리하는 사람도 채팅을 보니까요)
   추리하는 사람 본인은 단어를 모르므로 검사하지 않아요 — 막히면 그게 곧 정답 힌트가 되거든요. */
const CHAT_SEP = /[\s.,!?~^*\-_'"()\[\]{}:;·/\\|]+/;
const plainText = t => String(t || '').toLowerCase().replace(/[\s.,!?~^*\-_'"()\[\]{}:;·/\\|]/g, '');
function hasWord(text, w) {
  const t = plainText(w); if (!t) return false;
  if (t.length === 1) return String(text).toLowerCase().split(CHAT_SEP).includes(t);   // 한 글자는 단어로 쓸 때만
  return plainText(text).includes(t);
}
function leaksWord(text) {
  if (MODE !== 'ogame' || !G || activeOf(G) === MYID) return false;
  const ph = G.phase; if (!['pick', 'write', 'check', 'guess'].includes(ph)) return false;
  const bad = ph === 'pick' ? [...(G.cards[G.idx] || [])] : [word(G)];
  if (ph !== 'pick') clueList(G).forEach(c => bad.push(c.t));
  return bad.some(w => hasWord(text, w));
}
function chatTip(m) {
  document.querySelectorAll('.chat-tip').forEach(t => { t.textContent = m; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); });
  if (!document.querySelector('.chat-tip')) toast(m);
}
function writingNow() { return MODE === 'ogame' && G && G.phase === 'write' && giversOf(G).includes(MYID); }
function myChatInfo() {
  const r = ONL.room || {}, p = (r.players || {})[MYID];
  let color = '#999';
  if (G && G.order.includes(MYID)) color = pc(G, MYID);
  else { const i = lobbyPlayers().findIndex(x => x[0] === MYID); if (i >= 0) color = PCOL[i % 7]; }
  return { name: (p && p.name) || '손님', c: color };
}
function sendChat(text, quick) {
  text = String(text || '').replace(/\s+/g, ' ').trim();
  if (!text || !chatRef) return false;
  if (writingNow() && !quick) { chatTip('힌트를 쓰는 동안에는 서로 상의할 수 없어요. 빠른 채팅만 보낼 수 있어요'); return false; }
  if (onlyJamo(text)) { chatTip('초성만으로는 보낼 수 없어요'); return false; }
  if (leaksWord(text)) { chatTip('카드 단어나 힌트는 채팅으로 말할 수 없어요'); return false; }
  const now = Date.now();
  if (now - CHAT_SENT_AT < CHAT_COOL) { chatTip('너무 빨라요. 잠시 후에 보내세요'); return false; }
  text = squash(text).slice(0, CHAT_MAX);
  const { text: masked, hit } = maskBad(text); text = masked;
  if (text === CHAT_LAST_TEXT && now - CHAT_SENT_AT < CHAT_DUP) { chatTip('같은 메시지는 잠시 뒤에 보낼 수 있어요'); return false; }
  CHAT_SENT_AT = now; CHAT_LAST_TEXT = text;
  if (hit) chatTip('거친 표현은 별표로 가렸어요');
  chatRef.push({ uid: MYID, ...myChatInfo(), text, t: TS() }).catch(e => toast(fbErrMsg(e)));
  return true;
}
function chatHTML() {
  if (!CHAT.length) return `<div class="chat-empty">아직 대화가 없어요</div>`;
  return CHAT.map(m => `<div class="cmsg ${m.uid === MYID ? 'mine' : ''}"><span class="cn"><i style="background:${esc(m.c || '#999')}"></i>${esc(m.name || '')}</span><span class="ct">${esc(maskBad(String(m.text || '')).text)}</span></div>`).join('');
}
function renderChat() {
  const h = chatHTML();
  document.querySelectorAll('.chatbox').forEach(box => { box.innerHTML = h; box.scrollTop = box.scrollHeight; });
  const b = $('#chatBadge'); if (b) { b.textContent = CHAT_UNREAD > 9 ? '9+' : CHAT_UNREAD; b.style.display = CHAT_UNREAD ? '' : 'none'; }
}
function chatFormHTML(id) {
  return `<div class="chat-tip"></div>
    <form class="chatform" data-chat="${id}"><input type="text" id="${id}" maxlength="${CHAT_MAX}" placeholder="메시지" autocomplete="off" enterkeyhint="send"><button class="btn blue small" type="submit">보내기</button></form>`;
}
function chatBtnHTML() {
  return `<button class="ibtn chatbtn" data-a="openChat" title="채팅">💬<span class="cbadge" id="chatBadge" style="display:${CHAT_UNREAD ? '' : 'none'}">${CHAT_UNREAD > 9 ? '9+' : CHAT_UNREAD}</span></button>`;
}
function openChat() {
  CHAT_OPEN = true; CHAT_UNREAD = 0;
  $('#chatSheet').innerHTML = `<div class="modal" data-a="closeChat"><div class="panel chat-sheet" style="text-align:left">
    <div style="display:flex;align-items:center;margin-bottom:8px"><h2 style="flex:1;margin:0">💬 채팅</h2><button class="btn gray small" data-a="closeChat">닫기</button></div>
    <div class="chatbox"></div>
    <div class="chat-rule">추리하는 사람도 채팅을 볼 수 있어요. 카드 단어·힌트는 보낼 수 없고, 힌트를 쓰는 동안에는 상의 금지라서 빠른 채팅만 돼요.</div>
    <div class="quick">${QUICK.map(q => `<button class="qchip" data-a="quickChat" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    ${chatFormHTML('chatInput')}</div></div>`;
  renderChat();
  const b = $('#chatBadge'); if (b) b.style.display = 'none';
}
function closeChat() { CHAT_OPEN = false; const s = $('#chatSheet'); if (s) s.innerHTML = ''; }
/* 그 사람 좌석(또는 대기실 이젤) 위에 말풍선 */
function showBubble(m) {
  if (CHAT_OPEN || MODE !== 'ogame') return;
  const chip = document.querySelector(`[data-seat="${m.uid}"]`);
  const el = document.createElement('div'); el.className = 'bubble';
  el.innerHTML = `<b style="color:${esc(m.c || '#3a2a1a')}">${esc(m.name || '')}</b> ${esc(maskBad(String(m.text || '')).text)}`;
  if (chip) { const r = chip.getBoundingClientRect(); el.style.left = Math.min(window.innerWidth - 90, Math.max(90, r.left + r.width / 2)) + 'px'; el.style.top = Math.max(40, r.top - 6) + 'px'; }
  else { el.style.left = '50%'; el.style.top = '60px'; }
  $('#bubbleLayer').appendChild(el);
  setTimeout(() => el.classList.add('out'), 3600); setTimeout(() => el.remove(), 4200);
}

/* ============ 클릭 처리 ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.classList.contains('modal') && e.target !== el) return;   // 창 안쪽을 누르면 닫지 않음
  ac();
  const a = el.dataset.a;
  switch (a) {
    case 'goLocal': MODE = 'lsetup'; render(); break;
    case 'goOnline': MODE = 'oentry'; render(); break;
    case 'back': MODE = 'menu'; render(); break;
    case 'rules': rulesModal(); break;
    case 'sound': soundOn = !soundOn; lsSet('j1_sound', soundOn ? 'on' : 'off'); if (MODE === 'menu') render(); else { el.textContent = soundOn ? '🔊' : '🔇'; } break;
    case 'lcount': for (let i = 0; i < 7; i++) { const x = $('#ln' + i); if (x) LS.names[i] = x.value; } LS.n = +el.dataset.n; render(); break;
    case 'lstart': {
      const order = [], names = {}, colors = {};
      for (let i = 0; i < LS.n; i++) { const v = ($('#ln' + i).value || '').trim() || '플레이어' + (i + 1); LS.names[i] = v; const id = 'L' + i; order.push(id); names[id] = v; colors[id] = i; }
      G = newGame(order, names, colors); L = { seen: '', viewer: null }; LASTK = ''; MODE = 'local'; $('#app')._shell = false; render(); break;
    }
    case 'curtain': L.seen = localStep(G).key; W = {}; PREV = {}; SFX.pop(); render(); break;
    case 'ocreate': busy(el, '만드는 중…', oCreate()); break;
    case 'ojoin': busy(el, '참가 중…', oJoin()); break;
    case 'rejoin': resumeRoom(); break;
    case 'forget': lsDel(ROOM_KEY); render(); break;
    case 'diag': runDiag(); break;
    case 'closeModal': closeMsg(); break;
    case 'ostart': oStart(); break;
    case 'oleave': confirmLeave(); break;
    case 'doLeave': closeMsg(); doLeave(); break;
    case 'openChat': openChat(); break;
    case 'closeChat': closeChat(); if (MODE === 'ogame') render(); break;
    case 'quickChat': sendChat(el.dataset.q, true); break;
    case 'copy': try { navigator.clipboard.writeText(ONL.code); toast('방 코드를 복사했어요'); } catch (er) {} break;
    case 'copyLink': try { navigator.clipboard.writeText(location.origin + location.pathname + '?room=' + ONL.code); toast('초대 링크를 복사했어요'); } catch (er) {} break;
    case 'quit':
      if (MODE === 'ogame') { confirmLeave(); break; }
      if (!confirm('게임을 그만두고 나갈까요?')) break;
      if (MODE === 'ogame') confirmLeave(); else { MODE = 'menu'; G = null; render(); } break;
    case 'tomenu': MODE = 'menu'; G = null; render(); break;
    case 'again':
      if (MODE === 'local') { G = newGame(G.order, G.names, G.colors); L = { seen: '', viewer: null }; LASTK = ''; render(); }
      else { const g = G; stateRef.update({ game: newGame(g.order, g.names, g.colors), status: 'playing' }).catch(er => toast(fbErrMsg(er))); typingRef.remove().catch(() => {}); }
      break;
    case 'tolobby': stateRef.update({ status: 'lobby', game: null }).catch(er => toast(fbErrMsg(er))); typingRef.remove().catch(() => {}); break;
    case 'pick': doAct({ t: 'pick', n: +el.dataset.n }); break;
    case 'clear': clearW(el.dataset.id); break;
    case 'submit': {
      const n = per(G), texts = [];
      for (let i = 0; i < n; i++) {
        const v = (W['c' + i] || '').trim();
        if (!v) { shakeW('c' + i); return toast('힌트를 적어 주세요!'); }
        if (/\s/.test(v)) { shakeW('c' + i); return toast('딱 한 단어만! 띄어쓰기는 안 돼요'); }
        if (norm(v) === norm(word(G))) { shakeW('c' + i); return toast('정답 단어를 그대로 쓰면 안 돼요!'); }
        texts.push(v);
      }
      document.activeElement?.blur(); SFX.tak();
      doAct({ t: 'submit', texts, by: viewer() }); break;
    }
    case 'edit': doAct({ t: 'edit', by: viewer() }); break;
    case 'unknown': if (confirm('이 단어를 몰라요? 추리하는 사람이 번호를 다시 골라요.')) doAct({ t: 'unknown', by: viewer() }); break;
    case 'toggle': doAct({ t: 'toggle', k: el.dataset.k }); break;
    case 'confirm': doAct({ t: 'confirm' }); break;
    case 'guess': {
      const v = (W.gs || '').trim(); if (!v) { shakeW('gs'); return toast('정답을 적어 주세요'); }
      document.activeElement?.blur(); doAct({ t: 'guess', text: v }); break;
    }
    case 'pass': if (confirm('패스할까요? 이 카드만 상자로 들어가요.')) doAct({ t: 'pass' }); break;
    case 'override': doAct({ t: 'override' }); break;
    case 'next': doAct({ t: 'next' }); break;
    case 'skipoff': {
      const ps = G.order.filter(p => isGone(p)); doAct({ t: 'skipoff', ps }); break;
    }
    case 'skipturn': if (confirm('추리자의 차례를 넘길까요? 카드는 그대로 다음 사람이 써요.')) doAct({ t: 'skipturn' }); break;
  }
});

function busy(b, label, p) {
  const old = b.textContent; b.disabled = true; b.textContent = label;
  Promise.resolve(p).finally(() => { if (b.isConnected) { b.disabled = false; b.textContent = old; } });
}
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-chat]'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'); if (sendChat(inp.value)) inp.value = '';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'ocode') busy($('[data-a=ojoin]'), '참가 중…', oJoin());
});

if (new URLSearchParams(location.search).get('room')) MODE = 'oentry';   // 초대 링크로 들어오면 바로 참가 화면
render();
</script>
</body>
</html>
